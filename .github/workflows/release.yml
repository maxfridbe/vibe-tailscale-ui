name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev rpm
      - name: Install packaging tools
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm
      - name: Build
        run: cargo build --release
      - name: Generate DEB
        run: cargo deb --no-build
      - name: Generate RPM
        run: cargo generate-rpm
      - name: Rename binary
        run: mv target/release/vibe-tailscale-ui tailscale-ui-linux
      - name: Copy packages to root
        run: |
          cp target/debian/*.deb .
          cp target/generate-rpm/*.rpm .
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            tailscale-ui-linux
            *.deb
            *.rpm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Rename binary
        run: move target/release/vibe-tailscale-ui.exe tailscale-ui-windows.exe
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: tailscale-ui-windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Package DMG
        run: |
          mkdir -p "dist/Tailscale UI.app/Contents/MacOS"
          cp target/release/vibe-tailscale-ui "dist/Tailscale UI.app/Contents/MacOS/tailscale-ui"
          hdiutil create -volname "Tailscale UI" -srcfolder dist -ov -format UDZO tailscale-ui-macos-arm64.dmg
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: tailscale-ui-macos-arm64.dmg

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: .
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tailscale-ui-linux
            tailscale-ui-windows.exe
            tailscale-ui-macos-arm64.dmg
            *.deb
            *.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
