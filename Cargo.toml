[package]
name = "clay-rst-ui"
version = "0.1.1"
edition = "2024"

[package.metadata.deb]
maintainer = "Max Fridbe <maxfridbe@gmail.com>"
copyright = "2026, Max Fridbe"
license = "MIT"
depends = "$auto, libasound2, libx11-6, libxrandr2, libxi6, libgl1, libglu1-mesa, libxcursor1, libxinerama1"
section = "utils"
priority = "optional"
assets = [
    ["target/release/clay-rst-ui", "/usr/bin/tailscale-ui", "755"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/clay-rst-ui", dest = "/usr/bin/tailscale-ui", mode = "755" }
]

[dependencies]
clay-layout = { version = "0.4.0", features = ["raylib-renderer"] }
raylib = "5.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
